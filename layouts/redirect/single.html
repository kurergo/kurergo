<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <meta name="description" content="{{ .Description }}">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="origin-when-cross-origin">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta http-equiv="refresh" content="5;url={{ .Site.Params.referral_url }}">
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #202124; background: #f6f7f9; }
      main { width: min(100%, 520px); padding: 32px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(32, 33, 36, .12); }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 16px; background: #ffde40; font-size: 28px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 34px); }
      p { margin: 0 0 24px; color: #5f6368; line-height: 1.55; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 22px; border-radius: 12px; color: #111; background: #ffde40; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 18px; color: #777; }
    </style>
    <!-- Yandex.Metrika counter: загружается сразу, потому что страница быстро перенаправляет посетителя. -->
    <script>
      (function(m,e,t,r,i,k,a){
        m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
        m[i].l=1*new Date();
        for (var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
        k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
      })(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id={{ .Site.Params.yandex_metrika_id }}','ym');
      ym({{ .Site.Params.yandex_metrika_id }}, 'init', {ssr:true, clickmap:true, accurateTrackBounce:true, trackLinks:true});
    </script>
  </head>
  <body>
    <noscript><div><img src="https://mc.yandex.ru/watch/{{ .Site.Params.yandex_metrika_id }}" style="position:absolute; left:-9999px;" alt=""></div></noscript>
    <main>
      <div class="mark" aria-hidden="true">→</div>
      <h1>Переходим к регистрации</h1>
      <p>Сейчас откроется официальная страница регистрации курьера.</p>
      <a href="{{ .Site.Params.referral_url }}" rel="nofollow sponsored" data-manual-redirect>Продолжить вручную</a>
      <small>Если автоматический переход не сработал, нажмите кнопку.</small>
    </main>
    <script>
      (function() {
        var counterId = {{ .Site.Params.yandex_metrika_id }};
        var finalUrl = {{ .Site.Params.referral_url | jsonify | safeJS }};
        var goal = {{ .Site.Params.registration_goal | jsonify | safeJS }};
        var timeoutMs = {{ .Site.Params.redirect_timeout_ms }};
        var redirected = false;

        function redirect() {
          if (redirected) return;
          redirected = true;
          window.location.replace(finalUrl);
        }

        var query = new URLSearchParams(window.location.search);
        var goalParams = {};
        ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "yclid", "ysclid", "gclid"].forEach(function(name) {
          var value = query.get(name);
          if (value) goalParams[name] = value.slice(0, 200);
        });

        document.querySelector("[data-manual-redirect]").addEventListener("click", function() {
          redirected = true;
        });

        var fallback = window.setTimeout(redirect, timeoutMs);
        if (typeof window.ym === "function") {
          window.ym(counterId, "reachGoal", goal, goalParams, function() {
            window.clearTimeout(fallback);
            redirect();
          });
        }
      })();
    </script>
  </body>
</html>
