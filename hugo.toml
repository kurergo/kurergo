baseURL = "https://kurergo.ru/"
locale = "ru-RU"
title = "KurerGO"
defaultContentLanguage = "ru"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 22

[pagination]
  pagerSize = 20

[permalinks]
  landing = "/:slug/"

[frontmatter]
  date = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":git", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[params]
  description = "KurerGO — справочный ресурс о работе и подработке курьером: форматы доставки, ориентировочный доход, города, WIKI и регистрация онлайн."
  registration_redirect_url = "/go/yandex-courier/"
  referral_url = "https://reg.eda.yandex.ru/?advertisement_campaign=forms_for_agents&user_invite_code=569fd35d6ccc4111852a73036a77109f&utm_content=blank"
  registration_click_goal = "registration_cta_click"
  registration_goal = "outbound_yandex_courier"
  redirect_timeout_ms = 1500
  yandex_metrika_id = 109618174
  phone = ""
  city = "Россия"

[menu]
  [[menu.main]]
    name = "Доход"
    url = "/#income-calculator"
    weight = 10
  [[menu.main]]
    name = "Форматы"
    url = "/#formats"
    weight = 20
  [[menu.main]]
    name = "Твой город"
    url = "/#cities"
    weight = 30
  [[menu.main]]
    name = "WIKI"
    url = "/wiki/"
    weight = 40
  [[menu.main]]
    name = "Вопросы"
    url = "/#faq"
    weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services]
  [services.rss]
    limit = -1
